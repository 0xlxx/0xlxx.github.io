<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfdfd" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f1117" media="(prefers-color-scheme: dark)" />
    <title>Bjorn Li</title>
    <meta name="description" content="一个程序员" />
    <link rel="canonical" href="https://bjorn.men/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bjorn Li" />
    <meta property="og:title" content="Bjorn Li" />
    <meta property="og:description" content="一个程序员" />
    <meta property="og:url" content="https://bjorn.men/" />
    <meta name="twitter:card" content="summary" />
    <link rel="alternate" type="application/rss+xml" title="Bjorn Li" href="/rss.xml" />
    <script>
      ;(() => {
        // 首帧就定好主题，避免加载时闪一下。
        // 与 src/theme.ts 的 readPreference / resolveTheme 是同一套取值逻辑，改一边记得改另一边。
        let preference = 'system'
        try {
          const stored = localStorage.getItem('theme')
          if (stored === 'light' || stored === 'dark' || stored === 'system') preference = stored
        } catch {
          // 隐私模式读不到 localStorage，按跟随系统处理。
        }
        const dark =
          preference === 'dark' ||
          (preference === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
